<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tessera — build the seven-layer neighborhood</title>
  <meta name="description" content="A board-game-feel city-builder about building Tesserae and growing the Arcology. Open source. Fork it.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
