<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Civic Center: classical building with pediment + columns, tree, park bench. -->
  <rect width="100" height="100" rx="6" fill="#1A1E26"/>
  <rect width="100" height="100" rx="6" fill="#2EC9E3" opacity="0.10"/>
  <rect y="80" width="100" height="20" fill="#1A4730"/>
  <rect y="84" width="100" height="16" fill="#0B0D12"/>
  <!-- pediment -->
  <polygon points="14,46 50,18 86,46" fill="#2EC9E3" stroke="#0B0D12" stroke-width="2"/>
  <circle cx="50" cy="38" r="4" fill="#FFD84A" stroke="#0B0D12" stroke-width="1"/>
  <!-- building body -->
  <rect x="14" y="46" width="72" height="34" fill="#2EC9E3" stroke="#0B0D12" stroke-width="2"/>
  <!-- columns -->
  <g fill="#0B0D12">
    <rect x="20" y="48" width="4" height="30"/>
    <rect x="30" y="48" width="4" height="30"/>
    <rect x="40" y="48" width="4" height="30"/>
    <rect x="56" y="48" width="4" height="30"/>
    <rect x="66" y="48" width="4" height="30"/>
    <rect x="76" y="48" width="4" height="30"/>
  </g>
  <!-- entrance -->
  <rect x="46" y="58" width="8" height="22" fill="#0B0D12"/>
  <rect x="46" y="58" width="8" height="3" fill="#FFD84A" opacity="0.7"/>
  <!-- park tree -->
  <circle cx="8" cy="78" r="6" fill="#6BD89D" stroke="#0B0D12" stroke-width="1"/>
  <rect x="7" y="82" width="2" height="6" fill="#5C3F28"/>
  <!-- bench -->
  <rect x="86" y="84" width="12" height="2" fill="#8C6940"/>
  <rect x="87" y="86" width="1.5" height="4" fill="#8C6940"/>
  <rect x="95.5" y="86" width="1.5" height="4" fill="#8C6940"/>
</svg>
