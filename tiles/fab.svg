<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Chip Fab: cleanroom building + HVAC stack + central wafer disc with circuit pattern. -->
  <rect width="100" height="100" rx="6" fill="#1A1E26"/>
  <rect width="100" height="100" rx="6" fill="#527E9E" opacity="0.10"/>
  <rect y="84" width="100" height="16" fill="#0B0D12"/>
  <!-- HVAC stacks -->
  <rect x="68" y="14" width="6" height="14" fill="#3A4258" stroke="#0B0D12" stroke-width="1"/>
  <rect x="78" y="18" width="6" height="10" fill="#3A4258" stroke="#0B0D12" stroke-width="1"/>
  <!-- cleanroom building -->
  <rect x="10" y="28" width="80" height="56" fill="#2E4860" stroke="#527E9E" stroke-width="2"/>
  <!-- amber clean-room light bar -->
  <rect x="14" y="34" width="72" height="2.5" fill="#F9B934" opacity="0.85"/>
  <!-- wafer disc (the icon's heart) -->
  <circle cx="38" cy="58" r="14" fill="#C6CDD6" stroke="#0B0D12" stroke-width="1.5"/>
  <circle cx="38" cy="58" r="14" fill="url(#waferGrad)" opacity="0.65"/>
  <defs>
    <radialGradient id="waferGrad">
      <stop offset="0%"   stop-color="#F9B934"/>
      <stop offset="55%"  stop-color="#527E9E"/>
      <stop offset="100%" stop-color="#181B22"/>
    </radialGradient>
  </defs>
  <!-- circuit traces on wafer -->
  <g stroke="#0B0D12" stroke-width="0.8" opacity="0.6" fill="none">
    <line x1="24" y1="58" x2="52" y2="58"/>
    <line x1="38" y1="44" x2="38" y2="72"/>
    <circle cx="38" cy="58" r="5"/>
  </g>
  <!-- airlock door -->
  <rect x="62" y="58" width="20" height="22" fill="#181B22" stroke="#527E9E" stroke-width="1.5"/>
  <circle cx="72" cy="69" r="4" fill="#F9B934" opacity="0.75"/>
  <rect x="64" y="60" width="16" height="2" fill="#F9B934" opacity="0.5"/>
</svg>
