<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Coordination Node: central hub + six federated satellites + radiating links. -->
  <rect width="100" height="100" rx="6" fill="#1A1E26"/>
  <rect width="100" height="100" rx="6" fill="#EBC96A" opacity="0.10"/>
  <rect y="84" width="100" height="16" fill="#0B0D12"/>
  <!-- federated links -->
  <g stroke="#EBC96A" stroke-width="1.4" opacity="0.6">
    <line x1="50" y1="50" x2="50" y2="20"/>
    <line x1="50" y1="50" x2="50" y2="80"/>
    <line x1="50" y1="50" x2="24" y2="32"/>
    <line x1="50" y1="50" x2="76" y2="32"/>
    <line x1="50" y1="50" x2="24" y2="68"/>
    <line x1="50" y1="50" x2="76" y2="68"/>
  </g>
  <!-- six satellite nodes (Climate/Flow/Provision/Harmony/Growth/Memory) -->
  <g stroke="#0B0D12" stroke-width="1.5">
    <circle cx="50" cy="20" r="6" fill="#FFD84A"/>
    <circle cx="50" cy="80" r="6" fill="#FFD84A"/>
    <circle cx="24" cy="32" r="6" fill="#FFD84A"/>
    <circle cx="76" cy="32" r="6" fill="#FFD84A"/>
    <circle cx="24" cy="68" r="6" fill="#FFD84A"/>
    <circle cx="76" cy="68" r="6" fill="#FFD84A"/>
  </g>
  <!-- satellite labels -->
  <g fill="#0B0D12" font-family="ui-monospace, monospace" font-size="6.5" text-anchor="middle" font-weight="700">
    <text x="50" y="22.5">C</text>
    <text x="76" y="34.5">F</text>
    <text x="76" y="70.5">P</text>
    <text x="50" y="82.5">H</text>
    <text x="24" y="70.5">G</text>
    <text x="24" y="34.5">M</text>
  </g>
  <!-- central hub -->
  <circle cx="50" cy="50" r="13" fill="#EBC96A" stroke="#0B0D12" stroke-width="2"/>
  <circle cx="50" cy="50" r="6"  fill="#0B0D12"/>
  <circle cx="50" cy="50" r="2.5" fill="#FFD84A"/>
  <!-- pulse rings -->
  <circle cx="50" cy="50" r="17" fill="none" stroke="#EBC96A" stroke-width="0.8" opacity="0.4"/>
</svg>
