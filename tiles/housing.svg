<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Mass Timber Housing: warm-glowing midrise with CLT layer bands. -->
  <rect width="100" height="100" rx="6" fill="#1A1E26"/>
  <rect width="100" height="100" rx="6" fill="#BC8E5C" opacity="0.10"/>
  <rect y="84" width="100" height="16" fill="#0B0D12"/>
  <!-- main mass -->
  <rect x="18" y="18" width="64" height="68" fill="#BC8E5C" stroke="#0B0D12" stroke-width="2"/>
  <!-- CLT layer bands -->
  <g fill="#9C7344">
    <rect x="18" y="32" width="64" height="3"/>
    <rect x="18" y="50" width="64" height="3"/>
    <rect x="18" y="68" width="64" height="3"/>
  </g>
  <!-- timber grain hints -->
  <g stroke="#5C3F28" stroke-width="0.6" opacity="0.4">
    <line x1="22" y1="22" x2="22" y2="84"/>
    <line x1="36" y1="22" x2="36" y2="84"/>
    <line x1="50" y1="22" x2="50" y2="84"/>
    <line x1="64" y1="22" x2="64" y2="84"/>
    <line x1="78" y1="22" x2="78" y2="84"/>
  </g>
  <!-- warm windows -->
  <g fill="#FFD84A">
    <rect x="24" y="22" width="8" height="6"/>
    <rect x="38" y="22" width="8" height="6"/>
    <rect x="52" y="22" width="8" height="6"/>
    <rect x="66" y="22" width="8" height="6"/>
    <rect x="24" y="38" width="8" height="8"/>
    <rect x="38" y="38" width="8" height="8"/>
    <rect x="52" y="38" width="8" height="8"/>
    <rect x="66" y="38" width="8" height="8"/>
    <rect x="24" y="56" width="8" height="8"/>
    <rect x="38" y="56" width="8" height="8"/>
    <rect x="52" y="56" width="8" height="8"/>
    <rect x="66" y="56" width="8" height="8"/>
  </g>
  <!-- ground-floor entrance -->
  <rect x="44" y="74" width="12" height="12" fill="#3C2A1A"/>
  <rect x="44" y="74" width="12" height="2" fill="#FFD84A" opacity="0.6"/>
</svg>
